<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethan Vibes</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #0a0a0f; color: white; height: 100vh; display: flex; flex-direction: column; }
.header { padding: 20px; background: #11111a; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 20px; background: linear-gradient(90deg, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; }
.chat-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
.empty-icon { font-size: 60px; margin-bottom: 20px; opacity: 0.5; }
.empty-text { color: #888; font-size: 16px; margin-bottom: 10px; }
.empty-sub { color: #555; font-size: 14px; }
.messages { flex: 1; overflow-y: auto; padding: 20px; display: none; flex-direction: column; gap: 15px; }
.message { max-width: 80%; padding: 12px 16px; border-radius: 18px; }
.user { align-self: flex-end; background: #8b5cf6; }
.bot { align-self: flex-start; background: #1f1f2e; }
.input-area { padding: 15px; background: #11111a; border-top: 1px solid #222; display: flex; gap: 10px; }
input { flex: 1; padding: 14px 18px; background: #1f1f2e; border: 1px solid #333; border-radius: 25px; color: white; outline: none; }
button { padding: 14px 24px; background: #8b5cf6; border: none; border-radius: 25px; color: white; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="header">
<div class="dot"></div>
<h1>Ethan Vibes</h1>
</div>

<div class="chat-area" id="emptyState">
<div class="empty-icon">💜</div>
<div class="empty-text">No vibes yet</div>
<div class="empty-sub">Start a conversation with Ethan</div>
</div>

<div class="messages" id="messages"></div>

<div class="input-area">
<input type="text" id="input" placeholder="Type a vibe...">
<button onclick="send()">Send</button>
</div>

<script>
const emptyState = document.getElementById('emptyState');
const messagesDiv = document.getElementById('messages');
const input = document.getElementById('input');

function send() {
  const text = input.value.trim();
  if (!text) return;
  
  emptyState.style.display = 'none';
  messagesDiv.style.display = 'flex';
  
  addMessage(text, 'user');
  input.value = '';
  
  setTimeout(() => {
    addMessage("Hey! That's a cool vibe! ✨ Ethan here, ready to chat!", 'bot');
  }, 800);
}

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = `message ${type}`;
  div.textContent = text;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') send();
});
</script>
</body>
  </html>
