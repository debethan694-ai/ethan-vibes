<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan Vibes Full</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0b1014;color:#e9edef;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#verify{position:fixed;inset:0;background:#0b1014;z-index:9999;display:flex;justify-content:center;padding:20px;overflow-y:auto}
.step{width:100%;max-width:400px;display:none;flex-direction:column}.step.active{display:flex}
.box{background:#202c33;padding:20px;border-radius:16px}
.box input{width:100%;padding:14px;background:#0b1014;border:1px solid #2a3942;border-radius:10px;color:#fff;margin:8px 0;outline:none}
.box button{width:100%;padding:14px;background:linear-gradient(90deg,#8b5cf6,#ec4899);border:none;border-radius:24px;color:#fff;font-weight:700;margin-top:10px;cursor:pointer}
.header{height:58px;background:#0b1014;padding:0 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1f2c34;flex-shrink:0}
.search{margin:8px 12px;background:#202c33;border-radius:24px;padding:10px 14px;display:flex;gap:10px;flex-shrink:0}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.filters{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;flex-shrink:0}
.chip{padding:7px 14px;background:#202c33;border-radius:20px;font-size:13px;color:#8696a0;border:none;white-space:nowrap;cursor:pointer}
.chip.active{background:#0a332c;color:#53bdeb}
.archived{display:flex;gap:12px;padding:10px 16px;align-items:center;cursor:pointer;flex-shrink:0}
.chatlist{flex:1;overflow-y:auto}
.chat-row{display:flex;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03)}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.tick{font-size:13px;margin-left:4px}.tick.blue{color:#53bdeb}.tick.gray{color:#8696a0}
.bottom-nav{height:76px;background:#0b1014;border-top:1px solid #1f2c34;display:flex;justify-content:space-around;align-items:center;flex-shrink:0;padding-bottom:6px;z-index:5}
.nav{color:#8696a0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 18px;cursor:pointer}
.nav.active{color:#fff}.nav-icon{width:56px;height:30px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px}
.nav.active.nav-icon{background:#202c33}
.fab{position:fixed;bottom:92px;right:16px;width:56px;height:56px;border-radius:16px;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 16px rgba(0,0,0,.5);z-index:10;cursor:pointer}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}.panel.active{display:flex}
.chat-screen{position:fixed;inset:0;background:#0b1014;z-index:200;display:none;flex-direction:column}
.chat-top{height:58px;background:#202c33;display:flex;align-items:center;gap:10px;padding:0 10px;flex-shrink:0}
.chat-area{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.bubble{max-width:78%;padding:7px 10px 6px;border-radius:8px;font-size:14.6px;position:relative;word-break:break-word}
.bubble.user{align-self:flex-end;background:#005c4b;border-top-right-radius:0}
.bubble.bot{align-self:flex-start;background:#202c33;border-top-left-radius:0}
.bubble.meta{display:flex;justify-content:flex-end;gap:4px;margin-top:3px;font-size:11px;color:#8696a0}
.attach-menu{position:fixed;bottom:70px;left:8px;right:8px;background:#233138;border-radius:16px;padding:12px;display:none;grid-template-columns:repeat(4,1fr);gap:12px;z-index:300}
.attach-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.attach-icon{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
.input-bar{padding:6px 8px;background:#202c33;display:flex;gap:6px;align-items:flex-end;flex-shrink:0}
.input-bar input{flex:1;padding:12px 14px;border-radius:24px;border:none;background:#2a3942;color:#fff;outline:none;font-size:15px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#2a3942;border:none;color:#8696a0;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0}
.send-btn{width:44px;height:44px;border-radius:50%;background:#25d366;border:none;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0}
.settings-item{display:flex;gap:14px;padding:16px;border-bottom:1px solid #1f2c34;align-items:center;cursor:pointer}
.profile-header{padding:20px 16px;display:flex;gap:16px;align-items:center;background:#202c33}
.profile-pic{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;overflow:hidden;cursor:pointer}
.profile-pic img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:24px;font-size:13px;z-index:9999;display:none}
</style></head><body>
<div id="verify"><div class="step active" id="s1"><h1>Ethan Vibes 💜</h1><p style="color:#8696a0;margin:12px 0 20px">Full WhatsApp features! Verify your number.</p><div class="box"><input id="phone" value="+256789112128"><input id="uname" value="Ethan"><button onclick="goNext()">Next →</button></div></div><div class="step" id="s2"><h1>Verify OTP</h1><p style="color:#8696a0">Code to <b id="showP">+256</b> Demo: <b style="color:#25d366">123456</b></p><div class="box"><input id="otp" placeholder="123456" style="text-align:center;letter-spacing:10px;font-size:24px"><button onclick="goEnter()">Enter Ethan Vibes</button></div></div></div>
<div class="header"><h1>Ethan Vibes</h1><div style="display:flex;gap:18px;font-size:20px;align-items:center"><span onclick="showToast('Camera')">📷</span><span onclick="openSettings()">⚙️</span><span>⋮</span></div></div>
<div class="search">🔍<input id="searchBox" placeholder="Search..." oninput="renderChats()"></div>
<div class="filters"><button class="chip active" onclick="setFilter(this,'all')">All</button><button class="chip" onclick="setFilter(this,'unread')">Unread</button><button class="chip" onclick="setFilter(this,'fav')">Favorites</button><button class="chip" onclick="setFilter(this,'groups')">Groups</button><button class="chip" onclick="createGroup()">+ Group</button><button class="chip" onclick="createBroadcast()">📢 Broadcast</button></div>
<div class="archived" onclick="openArchived()"><span style="background:#00a884;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center">📦</span><span>Archived</span><span style="margin-left:auto;color:#25d366" id="archCount">0</span></div>
<div class="panel active" id="p-chats"><div class="chatlist" id="chatList"></div></div><div class="panel" id="p-calls"><div class="chatlist" id="callList"></div></div><div class="panel" id="p-updates"><div class="chatlist" id="statusList" style="padding:12px"></div></div><div class="panel" id="p-tools"><div class="chatlist" id="settingsList"></div></div>
<div class="bottom-nav"><div class="nav active" onclick="switchTab('chats',this)"><div class="nav-icon">💬</div>Chats</div><div class="nav" onclick="switchTab('calls',this)"><div class="nav-icon">📞</div>Calls</div><div class="nav" onclick="switchTab('updates',this)"><div class="nav-icon">⭕</div>Updates</div><div class="nav" onclick="switchTab('tools',this)"><div class="nav-icon">⚙️</div>Settings</div></div><div class="fab" onclick="newChat()">💬</div>
<div class="chat-screen" id="chatScreen"><div class="chat-top"><span onclick="closeChat()" style="font-size:26px;cursor:pointer">←</span><div class="avatar" id="cAv" style="width:38px;height:38px"></div><div style="flex:1" onclick="openChatInfo()"><b id="cName"></b><div style="font-size:12px;color:#8696a0" id="cStatus">tap for info</div></div><div style="display:flex;gap:14px;font-size:20px"><span onclick="startCall('voice')">📞</span><span onclick="startCall('video')">📹</span><span onclick="openChatMenu()">⋮</span></div></div><div class="chat-area" id="chatArea" style="background:#0b141a"></div><div class="attach-menu" id="attachMenu"><div class="attach-item" onclick="attachAction('camera')"><div class="attach-icon" style="background:#0a6eff">📷</div><span style="font-size:11px">Camera</span></div><div class="attach-item" onclick="attachAction('gallery')"><div class="attach-icon" style="background:#a884ff">🖼️</div><span style="font-size:11px">Gallery</span></div><div class="attach-item" onclick="attachAction('document')"><div class="attach-icon" style="background:#5f66cd">📄</div><span style="font-size:11px">Document</span></div><div class="attach-item" onclick="attachAction('audio')"><div class="attach-icon" style="background:#ff6b6b">🎵</div><span style="font-size:11px">Audio</span></div><div class="attach-item" onclick="attachAction('location')"><div class="attach-icon" style="background:#1ea952">📍</div><span style="font-size:11px">Location</span></div><div class="attach-item" onclick="attachAction('contact')"><div class="attach-icon" style="background:#009de2">👤</div><span style="font-size:11px">Contact</span></div><div class="attach-item" onclick="attachAction('poll')"><div class="attach-icon" style="background:#febd00">📊</div><span style="font-size:11px">Poll</span></div><div class="attach-item" onclick="closeAttach()"><div class="attach-icon" style="background:#333">✕</div><span style="font-size:11px">Close</span></div></div><div class="input-bar"><button class="icon-btn" onclick="toggleEmoji()">😊</button><button class="icon-btn" onclick="toggleAttach()">📎</button><input id="msgInput" placeholder="Message" oninput="onTyping()" onkeydown="if(event.key==='Enter')sendMsg()"><button class="icon-btn" id="micBtn" onmousedown="startVoice()" onmouseup="stopVoice()" ontouchstart="startVoice()" ontouchend="stopVoice()">🎙️</button><button class="send-btn" onclick="sendMsg()">➤</button></div></div><div class="toast" id="toast"></div><input type="file" id="filePicker" accept="image/*" style="display:none">
<script>
function goNext(){let p=document.getElementById('phone').value.trim(),n=document.getElementById('uname').value.trim();if(!p||!n){alert('Enter phone+name');return;}document.getElementById('showP').textContent=p;localStorage.setItem('ev_phone',p);localStorage.setItem('ev_name',n);document.getElementById('s1').classList.remove('active');document.getElementById('s2').classList.add('active');}
function goEnter(){if(document.getElementById('otp').value.trim().length<3){alert('Enter 123456');return;}localStorage.setItem('ev_verified','true');document.getElementById('verify').style.display='none';init();}
if(localStorage.getItem('ev_verified')){document.getElementById('verify').style.display='none';}
let chats=JSON.parse(localStorage.getItem('ev_chats')||'[{"name":"Business assistant","msg":"Ayyy it is OPEN NOW! 🔥","time":"8:49 AM","unread":0,"lastSeen":"online","verified":true},{"name":"+256 793 145785","msg":"Nice jal me am also here","time":"7:23 AM","lastSeen":"today, 7:30 AM"},{"name":"CINDY","msg":"Missed voice call","time":"Yesterday","isCall":true,"lastSeen":"yesterday"},{"name":"Alibaba.com","msg":"The record for EPARK Coin...","time":"Yesterday","unread":1},{"name":"VERIDIAN INSTITUTE","msg":"Noeline: Video","time":"Yesterday","lastSeen":"online"},{"name":"JUDE","msg":"Apwoyo matek","time":"Yesterday"},{"name":"OUNA FOUNDATION","msg":"Group message","time":"10/13/26","isGroup":true}]');
let msgs=JSON.parse(localStorage.getItem('ev_msgs')||'{}');let starred=JSON.parse(localStorage.getItem('ev_starred')||'[]');let settings=JSON.parse(localStorage.getItem('ev_settings')||'{"wallpaper":"wall1","about":"Hey there! I am using Ethan Vibes 💜","photo":"","readReceipts":true,"lastSeen":true}');
let currentFilter='all',showArchived=false;
function init(){renderAll();renderSettings();renderCalls();renderStatus();}
function showToast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2000);}
function renderAll(){renderChats();document.getElementById('archCount').textContent=chats.filter(c=>c.archived).length;}
function renderChats(){let list=document.getElementById('chatList'),q=(document.getElementById('searchBox').value||'').toLowerCase();let data=chats.filter(c=>{if(!showArchived&&c.archived)return false;if(showArchived&&!c.archived)return false;if(currentFilter==='unread'&&!c.unread)return false;if(currentFilter==='groups'&&!c.isGroup)return false;if(q&&!c.name.toLowerCase().includes(q))return false;return true;});list.innerHTML='';if(showArchived){list.innerHTML=`<div style="padding:12px;display:flex;gap:8px"><span onclick="closeArchived()" style="font-size:22px;cursor:pointer">←</span><b>Archived (${data.length})</b></div>`;}data.forEach(c=>{let idx=chats.indexOf(c);let photo=c.photo?`<img src="${c.photo}">`:c.name[0].toUpperCase();let tick=c.tick||'';let tickHtml=tick==='read'?'<span class="tick blue">✓✓</span>':tick==='delivered'?'<span class="tick gray">✓✓</span>':tick==='sent'?'<span class="tick gray">✓</span>':'';let muted=c.muted?'🔇 ':'';list.innerHTML+=`<div class="chat-row" onclick="openChat(${idx})"><div class="avatar">${photo}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between"><b>${muted}${c.name}${c.verified?' ✔️':''}</b><span style="font-size:12px;color:${c.unread?'#25d366':'#8696a0'}">${c.time}</span></div><div style="display:flex;justify-content:space-between"><div style="font-size:14px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center">${tickHtml}${c.isCall?'📞 ':''}${c.msg}</div>${c.unread?`<span style="background:#25d366;color:#0b1014;padding:2px 7px;border-radius:12px;font-size:12px">${c.unread}</span>`:''}</div></div></div>`;});}
function newChat(){let n=prompt('Name / Number');if(!n)return;chats.unshift({name:n,msg:'Hi on Ethan Vibes 💜',time:'now',lastSeen:'online',tick:'sent'});localStorage.setItem('ev_chats',JSON.stringify(chats));renderAll();openChat(0);}
function createGroup(){let n=prompt('Group name');if(!n)return;chats.unshift({name:n,msg:'Group created',time:'now',isGroup:true,tick:'sent'});localStorage.setItem('ev_chats',JSON.stringify(chats));renderAll();showToast('Group '+n+' created');}
function createBroadcast(){let n=prompt('Broadcast list name');if(!n)return;chats.unshift({name:'📢 '+n,msg:'Broadcast list',time:'now',tick:'sent'});localStorage.setItem('ev_chats',JSON.stringify(chats));renderAll();showToast('Broadcast created');}
function openArchived(){showArchived=true;renderChats();}function closeArchived(){showArchived=false;renderChats();}
let currentChat=null;
function openChat(i){currentChat=chats[i];currentChat.unread=0;localStorage.setItem('ev_chats',JSON.stringify(chats));document.getElementById('chatScreen').style.display='flex';document.getElementById('cName').textContent=currentChat.name;document.getElementById('cAv').innerHTML=currentChat.photo?`<img src="${currentChat.photo}" style="width:100%;height:100%">`:currentChat.name[0];updateChatStatus('online');setTimeout(()=>updateChatStatus(currentChat.lastSeen||'last seen today'),2000);loadMsgs();renderAll();}
function closeChat(){document.getElementById('chatScreen').style.display='none';currentChat=null;}
function updateChatStatus(s){let el=document.getElementById('cStatus');if(s==='online'){el.textContent='online';el.style.color='#25d366';}else if(s.includes('typing')){el.textContent='typing...';el.style.color='#25d366';}else{el.textContent=s;el.style.color='#8696a0';}}
function onTyping(){if(!currentChat)return;updateChatStatus('typing...');clearTimeout(window._typeTimer);window._typeTimer=setTimeout(()=>updateChatStatus(currentChat.lastSeen||'last seen today'),1500);}
function loadMsgs(){let area=document.getElementById('chatArea');area.innerHTML='';let key=currentChat.name;let arr=msgs[key]||[];arr.forEach((m,idx)=>{let d=document.createElement('div');d.className='bubble '+(m.type==='user'?'user':'bot');let tick=m.type==='user'?(m.tick==='read'?'<span class="tick blue">✓✓</span>':m.tick==='delivered'?'<span class="tick gray">✓✓</span>':'<span class="tick gray">✓</span>'):'';let star=starred.includes(key+'-'+idx)?'⭐ ':'';d.innerHTML=`${star}${m.text}<div class="meta">${m.time||'now'} ${tick}</div>`;d.onclick=()=>{let a=prompt('1=Star 2=Delete');if(a==='1'){let id=key+'-'+idx;if(starred.includes(id))starred=starred.filter(s=>s!==id);else starred.push(id);localStorage.setItem('ev_starred',JSON.stringify(starred));loadMsgs();}else if(a==='2'){msgs[key].splice(idx,1);localStorage.setItem('ev_msgs',JSON.stringify(msgs));loadMsgs();}};area.appendChild(d);});area.scrollTop=area.scrollHeight;}
function sendMsg(){let inp=document.getElementById('msgInput');let txt=inp.value.trim();if(!txt||!currentChat)return;let key=currentChat.name;if(!msgs[key])msgs[key]=[];msgs[key].push({text:txt,type:'user',time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),tick:'sent'});localStorage.setItem('ev_msgs',JSON.stringify(msgs));inp.value='';loadMsgs();currentChat.msg=txt;currentChat.time='now';currentChat.tick='sent';localStorage.setItem('ev_chats',JSON.stringify(chats));renderAll();setTimeout(()=>{msgs[key][msgs[key].length-1].tick='delivered';loadMsgs();},800);setTimeout(()=>{msgs[key][msgs[key].length-1].tick='read';loadMsgs();},1800);setTimeout(()=>{msgs[key].push({text:'💜 '+txt,type:'bot',time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});localStorage.setItem('ev_msgs',JSON.stringify(msgs));loadMsgs();},1200);}
function toggleAttach(){let m=document.getElementById('attachMenu
