<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ethan Vibes</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0b1014;color:#e9edef;height:100vh;display:flex;flex-direction:column;overflow:hidden}#verify{position:fixed;inset:0;background:#0b1014;z-index:9999;display:flex;justify-content:center;padding:24px}#verify.step{width:100%;max-width:380px;display:none;flex-direction:column}.step.active{display:flex}.step h1{font-size:36px;font-weight:900;color:#fff;margin-top:20px}.box{background:#202c33;width:100%;padding:20px;border-radius:16px}.box input{width:100%;padding:14px;background:#0b1014;border:1px solid #2a3942;border-radius:10px;color:#fff;margin:8px 0;font-size:16px;outline:none}.box button{width:100%;padding:14px;background:linear-gradient(90deg,#8b5cf6,#ec4899);border:none;border-radius:24px;color:#fff;font-weight:700;font-size:16px;margin-top:12px;cursor:pointer}.header{height:56px;background:#0b1014;padding:0 16px;display:flex;justify-content:space-between;align-items:center}.search{margin:6px 12px;background:#202c33;border-radius:24px;padding:10px 14px;display:flex;gap:10px}.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}.filters{display:flex;gap:8px;padding:8px 12px;overflow-x:auto}.chip{padding:8px 14px;background:#202c33;border-radius:20px;font-size:13px;color:#8696a0;border:none;white-space:nowrap}.chip.active{background:#0a332c;color:#53bdeb}.chatlist{flex:1;overflow-y:auto}.chat-row{display:flex;gap:12px;padding:12px 16px;cursor:pointer}.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:flex;align-items:center;justify-content:center;font-weight:800}.bottom-nav{height:72px;background:#0b1014;border-top:1px solid #1f2c34;display:flex;justify-content:space-around;align-items:center}.nav{color:#8696a0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 20px;cursor:pointer}.nav.active{color:#fff}.nav-icon{width:54px;height:28px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:18px}.nav.active.nav-icon{background:#202c33}.fab{position:fixed;bottom:88px;right:16px;width:56px;height:56px;border-radius:16px;background:#202c33;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:10}.chat-screen{position:fixed;inset:0;background:#0b1014;z-index:200;display:none;flex-direction:column}.chat-top{height:56px;background:#202c33;display:flex;align-items:center;gap:10px;padding:0 10px}.chat-area{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;background:#0b141a}.bubble{max-width:78%;padding:8px 10px;border-radius:8px;font-size:14px}.bubble.user{align-self:flex-end;background:#005c4b}.bubble.bot{align-self:flex-start;background:#202c33}.input-bar{padding:6px 8px;background:#202c33;display:flex;gap:6px}.input-bar input{flex:1;padding:11px 14px;border-radius:24px;border:none;background:#2a3942;color:#fff;outline:none}.panel{display:none;flex:1;flex-direction:column;overflow:hidden}.panel.active{display:flex}</style></head><body>
<div id="verify"><div class="step active" id="s1"><h1>Ethan Vibes</h1><p style="color:#8696a0;margin:10px 0 20px">The vibe messenger. Like WhatsApp but owned by Ethan 💜 Verify your number.</p><div class="box"><input id="phone" type="tel" value="+256789112128"><input id="uname" type="text" value="Ethan"><button id="nextBtn">Next →</button></div></div><div class="step" id="s2"><h1>Verify</h1><p style="color:#8696a0">Code to <b id="showP">+256</b> Demo:123456</p><div class="box"><input id="otp" type="tel" placeholder="123456" style="text-align:center;letter-spacing:8px;font-size:22px"><button id="verifyBtn">Enter Ethan Vibes 💜</button></div></div></div>
<div class="header"><h1>Ethan Vibes</h1><span>📷 ⋮</span></div><div class="search">🔍<input id="searchBox" placeholder="Search..." oninput="renderChats()"></div><div class="filters"><button class="chip active">All</button><button class="chip">Unread</button><button class="chip">Favorites</button><button class="chip">Groups</button><button class="chip" onclick="newChat()">+</button></div><div class="panel active" id="p-chats"><div class="chatlist" id="chatList"></div></div><div class="panel" id="p-calls"><div class="chatlist" style="padding:40px;text-align:center;color:#8696a0">📞 No calls</div></div><div class="panel" id="p-updates"><div class="chatlist" style="padding:16px"><div style="padding:14px;background:#202c33;border-radius:12px;border:1px dashed #8b5cf6">+ My Vibe Status</div></div></div><div class="panel" id="p-tools"><div class="chatlist" style="padding:30px;text-align:center;color:#8696a0"><div style="font-size:60px">💜</div><h3>Tools</h3></div></div><div class="bottom-nav"><div class="nav active" onclick="switchTab('chats',this)"><div class="nav-icon">💬</div>Chats</div><div class="nav" onclick="switchTab('calls',this)"><div class="nav-icon">📞</div>Calls</div><div class="nav" onclick="switchTab('updates',this)"><div class="nav-icon">⭕</div>Updates</div><div class="nav" onclick="switchTab('tools',this)"><div class="nav-icon">🛠️</div>Tools</div></div><div class="fab" onclick="newChat()">+</div><div class="chat-screen" id="chatScreen"><div class="chat-top"><span onclick="closeChat()" style="font-size:24px">←</span><div class="avatar" id="cAv" style="width:38px;height:38px"></div><div style="flex:1"><b id="cName"></b></div></div><div class="chat-area" id="chatArea"></div><div class="input-bar"><input id="msgInput" placeholder="Message"><button onclick="sendMsg()">➤</button></div></div>
<script>
document.getElementById('nextBtn').addEventListener('click', function(){var p=document.getElementById('phone').value.trim();var n=document.getElementById('uname').value.trim();if(!p||!n){alert('Enter phone+name');return;}document.getElementById('showP').textContent=p;localStorage.setItem('ev_phone',p);localStorage.setItem('ev_name',n);document.getElementById('s1').classList.remove('active');document.getElementById('s2').classList.add('active');});
document.getElementById('verifyBtn').addEventListener('click', function(){var code=document.getElementById('otp').value.trim();if(code.length<3){alert('Enter 123456');return;}localStorage.setItem('ev_verified','true');document.getElementById('verify').style.display='none';renderAll();});
if(localStorage.getItem('ev_verified')){document.getElementById('verify').style.display='none';}
let chats=JSON.parse(localStorage.getItem('ev_chats')||'[{"name":"Business assistant","msg":"Ayyy it is OPEN NOW! 🔥","time":"8:49 AM","unread":0},{"name":"+256 793 145785","msg":"Nice jal me am also here","time":"7:23 AM"},{"name":"CINDY","msg":"Missed voice call","time":"Yesterday","isCall":true},{"name":"Alibaba.com","msg":"The record...","time":"Yesterday","unread":1},{"name":"VERIDIAN INSTITUTE","msg":"Noeline: Video","time":"Yesterday"},{"name":"JUDE","msg":"Apwoyo matek","time":"Yesterday"},{"name":"OUNA FOUNDATION","msg":"Group","time":"10/13/26","isGroup":true}]');let msgs=JSON.parse(localStorage.getItem('ev_msgs')||'{}');
function renderAll(){renderChats();}function renderChats(){let list=document.getElementById('chatList');let q=(document.getElementById('searchBox').value||'').toLowerCase();let data=chats.filter(c=>!q||c.name.toLowerCase().includes(q));list.innerHTML='';data.forEach((c,idx)=>{let realIdx=chats.indexOf(c);let av='<div class="avatar">'+c.name[0].toUpperCase()+'</div>';let unread=c.unread?'<span style="background:#25d366;color:#0b1014;padding:2px 7px;border-radius:12px;font-size:12px">'+c.unread+'</span>':'';list.innerHTML+='<div class="chat-row" onclick="openChat('+realIdx+')">'+av+'<div style="flex:1"><div style="display:flex;justify-content:space-between"><b>'+c.name+'</b><span style="font-size:12px;color:'+(c.unread?'#25d366':'#8696a0')+'">'+c.time+'</span></div><div style="display:flex;justify-content:space-between"><div style="font-size:14px;color:#8696a0">'+c.msg+'</div>'+unread+'</div></div></div>';});}
function newChat(){let n=prompt('Name / Number');if(!n)return;chats.unshift({name:n,msg:'Hi on Ethan Vibes 💜',time:'now'});localStorage.setItem('ev_chats',JSON.stringify(chats));renderAll();openChat(0);}
function openChat(i){let c=chats[i];window.currentChat=c;document.getElementById('chatScreen').style.display='flex';document.getElementById('cName').textContent=c.name;document.getElementById('cAv').textContent=c.name[0].toUpperCase();loadMsgs();}
function closeChat(){document.getElementById('chatScreen').style.display='none';}
function loadMsgs(){let area=document.getElementById('chatArea');area.innerHTML='';let key=window.currentChat.name;let arr=msgs[key]||[];arr.forEach(m=>{let d=document.createElement('div');d.className='bubble '+(m.type==='user'?'user':'bot');d.textContent=m.text;area.appendChild(d);});area.scrollTop=area.scrollHeight;}
function sendMsg(){let txt=document.getElementById('msgInput').value.trim();if(!txt||!window.currentChat)return;if(!msgs[window.currentChat.name])msgs[window.currentChat.name]=[];msgs[window.currentChat.name].push({text:txt,type:'user'});localStorage.setItem('ev_msgs',JSON.stringify(msgs));document.getElementById('msgInput').value='';loadMsgs();setTimeout(()=>{msgs[window.currentChat.name].push({text:'💜 '+txt,type:'bot'});localStorage.setItem('ev_msgs',JSON.stringify(msgs));loadMsgs();},600);}
function switchTab(t,el){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));document.getElementById('p-'+t).classList.add('active');el.classList.add('active');}
renderAll();
</script></body></html>
