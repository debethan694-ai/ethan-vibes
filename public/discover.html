<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21113d">
  <meta name="description" content="Discover music, movies and videos on Ethan Vibes.">
  <title>Discover — Ethan Vibes</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">EV<span>♫</span></span>
      <span><strong>ETHAN VIBES</strong><small>MUSIC · MOVIES · YOUR VIBE</small></span>
    </a>
    <a class="outline-btn" href="/">Home</a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">EXPLORE ETHAN VIBES</p>
      <h1>Discover your <span>next favourite.</span></h1>
      <p class="hero-copy">Explore music, movies and videos in one place.</p>
      <label class="searchbox">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search everything..." autocomplete="off">
      </label>
      <nav class="filters" aria-label="Discover categories">
        <button class="chip active" data-filter="all">Everything</button>
        <button class="chip" data-filter="music">♫ Music</button>
        <button class="chip" data-filter="movie">🎬 Movies</button>
        <button class="chip" data-filter="video">▶ Videos</button>
      </nav>
    </section>

    <section class="section">
      <div class="section-heading">
        <div><p class="eyebrow">EXPLORE THE COLLECTION</p><h2>Discover content</h2></div>
        <span class="muted" id="resultCount">Loading…</span>
      </div>
      <div id="mediaGrid" class="media-grid">
        <div class="empty">Loading content…</div>
      </div>
    </section>
  </main>

  <footer>
    <span class="brand-mark small-mark">EV<span>♫</span></span>
    <p>© <span id="year"></span> Ethan Vibes · Feel every moment.</p>
  </footer>

  <script src="/discover.js" defer></script>
</body>
  </html>
