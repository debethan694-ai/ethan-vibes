name = "ethan-vibes"
main = "index.js"
compatibility_date = "2026-10-28"

# Configure the bindings in Cloudflare dashboard or uncomment/update IDs below.
# [[d1_databases]]
# binding = "DB"
# database_name = "ethan-vibes-db"
# database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# [[r2_buckets]]
# binding = "MEDIA"
