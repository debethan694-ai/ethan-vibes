name = "ethan-vibes"
main = "index.js"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ethan-vibes-db"
database_id = "ac7b62ee-2c2a-4912-a8c7-49ec4ae3f5b4"

# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "ethan-vibes-media"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]


[alias]
"@aws-sdk/xml-builder" = "@aws-sdk/xml-builder/dist-cjs/index.js"
